{% extends 'base.html' %}

{% block content %}
<div class="w-full max-w-md mx-auto p-8 bg-baby_powder dark:bg-black-500 rounded-2xl shadow-lg">
    <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-semibold text-black-600 dark:text-baby_powder">Voter Authentication</h1>
        <p class="text-khaki dark:text-khaki-600 mt-2">Please scan your ID or enter your Student ID to proceed.</p>
    </div>

    <div class="mb-6">
        <div id="qr-scanner-placeholder" class="w-full h-64 bg-khaki-900 dark:bg-black-600 rounded-lg flex items-center justify-center">
            <p class="text-khaki dark:text-khaki-700">QR Scanner Loading...</p>
        </div>
    </div>

    <div class="relative mb-6">
        <div class="absolute inset-0 flex items-center">
            <span class="w-full border-t border-khaki-700 dark:border-black-700"></span>
        </div>
        <div class="relative flex justify-center text-sm">
            <span class="px-2 bg-baby_powder dark:bg-black-500 text-khaki dark:text-khaki-600">OR</span>
        </div>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div>
            <label for="student_id" class="block text-sm font-normal text-black-700 dark:text-khaki-600 mb-2">Student ID Number</label>
            <input 
                type="text" 
                name="student_id" 
                id="student_id" 
                class="w-full px-4 py-3 bg-khaki-800 dark:bg-black-600 border border-transparent rounded-lg text-black-600 dark:text-baby_powder focus:outline-none focus:ring-2 focus:ring-orange_wheel focus:border-transparent transition"
                placeholder="e.g., 23CA101"
                required
            >
        </div>

        <div class="mt-8">
            <button 
                type="submit" 
                class="w-full py-3 px-4 bg-orange_wheel hover:bg-coquelicot rounded-lg text-baby_powder font-semibold text-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange_wheel dark:focus:ring-offset-black-500 transition-all duration-300 transform hover:scale-105"
            >
                Verify & Proceed
            </button>
        </div>
    </form>
</div>
{% endblock %}
