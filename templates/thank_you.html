{% extends 'base.html' %}

{% block content %}
<div class="text-center">
    <h1 class="text-5xl font-semibold text-baby_powder">Thank You For Voting!</h1>
    <p class="text-khaki mt-4 text-lg">Your vote has been securely recorded.</p>
    <p class="text-khaki-600 mt-8">This screen will reset automatically.</p>

<script>
    // Redirect back to the home page after 5 seconds

        window.location.href = "{% url 'voter_kiosk' %}";
    }, 5000); // 5000 milliseconds = 5 seconds
</script>
{% endblock %}
