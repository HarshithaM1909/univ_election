<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Election Results</title>
    <style>
        @page {
            size: A4;
            margin: 1.5cm;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #111;
            border-bottom: 2px solid #555;
            padding-bottom: 10px;
        }
        .meta-info {
            text-align: center;
            margin-bottom: 30px;
            color: #666;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .position {
            font-weight: bold;
        }
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.8em;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="footer">
        Generated by University Election Application
    </div>

    <h1>Official Election Results</h1>
    <div class="meta-info">
        Report Generated on: {{ date|date:"F j, Y" }}
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Candidate Name</th>
            </tr>
        </thead>
        <tbody>
            {% for candidate in results %}
            <tr>
                <td class="position">{{ forloop.counter }}</td>
                <td>{{ candidate.name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
