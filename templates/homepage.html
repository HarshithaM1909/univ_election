{% extends 'base.html' %}

{% block content %}
<div class="text-center">
    <div class="mb-12">
        <h1 class="text-5xl md:text-7xl font-bold text-baby_powder">University Election Portal</h1>
        <p class="text-khaki mt-4 text-xl">Secure, Transparent, and Auditable Elections.</p>
    </div>

    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">
        <a href="{% url 'voter_kiosk' %}" class="block p-10 bg-black-500 rounded-2xl shadow-lg hover:bg-orange_wheel/20 hover:-translate-y-1 transition-all duration-300">
            <h2 class="text-4xl font-semibold text-baby_powder">🗳️</h2>
            <h3 class="mt-4 text-2xl font-semibold text-baby_powder">Voter Kiosk</h3>
            <p class="text-khaki-600 mt-2">Proceed to the secure voting station to cast your vote.</p>
        </a>

        <a href="{% url 'officer_login' %}" class="block p-10 bg-black-500 rounded-2xl shadow-lg hover:bg-orange_wheel/20 hover:-translate-y-1 transition-all duration-300">
            <h2 class="text-4xl font-semibold text-baby_powder">🔒</h2>
            <h3 class="mt-4 text-2xl font-semibold text-baby_powder">Official Login</h3>
            <p class="text-khaki-600 mt-2">Access for Election Officers and administrative staff.</p>
        </a>
    </div>
</div>
{% endblock %}
